name: Update Coffee Rankings

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour (UTC)
  workflow_dispatch: {}    # allows manual "Run workflow" trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest Naver search trend data
        run: node backend/fetch-trends.mjs
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Commit updated rankings
        run: |
          git config user.name "coffee-rank-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/rankings.json
          git diff --cached --quiet || git commit -m "chore: update rankings [skip ci]"
          git push
